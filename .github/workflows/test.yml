name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-java@v4          # PySpark 4 needs Java 17+
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Delta Lake jars (downloaded by delta-spark on first Spark start)
        uses: actions/cache@v4
        with:
          path: ~/.ivy2*
          key: ivy-delta-4.0.0

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Tests (unit, data quality, integration) with coverage
        env:
          SPARK_MASTER: local[2]
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  # Databricks tests are intentionally NOT run here: CI needs no workspace credentials.
  # See docs/testing.md for running the notebooks against a workspace.
