[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src"]
omit = ["src/bronze/ingest_*.py"]   # thin CLI entry points over src/bronze/ingest.py

[tool.coverage.report]
exclude_lines = ["if __name__ == .__main__.:", "pragma: no cover"]

[tool.ruff]
line-length = 150
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E731", "B008"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_sample_data.py" = ["E741"]   # `l` for lease rows reads naturally here
